<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
<style>
:root{color-scheme:light;--bg:#F3F5F7;--card:#fff;--ink:#29313A;--muted:#707984;--line:#E1E6EB;--accent:#6D8196;--needs:#6D8196;--wants:#4A4A4A;--save:#879987;--free:#CBCBCB;--bad:#985f55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",system-ui,sans-serif}
main{max-width:1020px;margin:0 auto;padding:40px 24px 72px}
header{text-align:center;margin:0 auto 20px;max-width:650px}
h1{font-size:2.35rem;margin:0;letter-spacing:-.045em;font-weight:700}
h2{font-size:1rem;margin:0 0 16px;letter-spacing:-.01em}
.sub{display:none}
#loading{text-align:center;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(260px, .82fr) minmax(0,1.5fr);gap:18px;align-items:start}
@media(max-width:780px){main{padding:30px 16px 48px}.layout{grid-template-columns:1fr}h1{font-size:2rem}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 5px 18px #4A4A4A0a}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px}
input:focus,select:focus{border-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:9px;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:background .15s,border-color .15s,transform .15s}
button:hover{background:#f5f5ef;border-color:#b8b9ae}button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;margin-top:14px;font-weight:650;padding:11px}
button.primary:hover{background:#5b7187}
button.link{border:0;background:none;color:var(--muted);padding:2px 6px;font-size:.83rem}button.link:hover{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em;margin:8px 0 0}
.tools{display:flex;gap:8px;margin-top:10px}.tools button{flex:1;font-size:.82rem}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
ul.items li:last-child{border-bottom:0}.empty{color:var(--muted);font-size:.9rem}
.hero{text-align:center;padding:28px}.hero .big{font-size:2.8rem;font-weight:700;letter-spacing:-.05em;line-height:1.1;color:var(--accent)}
.hero .big.bad{color:var(--bad)}.hero p{margin:8px auto 20px;color:var(--muted);font-size:.9rem}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--free)}.split div{height:100%}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:7px 18px;margin-top:14px;font-size:.79rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chart-card{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.chart-card:first-child{grid-column:1/-1}
.chart-title{font-size:.82rem;font-weight:650;margin:0 0 14px;color:var(--ink)}
@media(max-width:580px){.charts{grid-template-columns:1fr}.chart-card:first-child{grid-column:auto}.card{padding:18px}}
.donut-layout{display:flex;align-items:center;justify-content:center;gap:32px;min-height:150px}.donut{width:150px;max-width:40%;overflow:visible}.donut-total{font:700 10px Inter,system-ui,sans-serif;fill:var(--ink)}.donut-caption{font:6px Inter,system-ui,sans-serif;fill:var(--muted)}
.chart-legend{width:min(100%,300px)}.chart-legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:.78rem;border-bottom:1px solid #f0f0e9}.chart-legend-row:last-child{border:0}.chart-legend-row i{width:8px;height:8px;border-radius:50%}.chart-legend-row b{font-weight:600}
.compare-chart,.category-chart{display:grid;gap:16px}.compare-label,.category-label{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;margin-bottom:6px}.compare-label b,.category-label b{font-weight:650}.track{height:9px;background:#eeeee8;border-radius:99px;position:relative;overflow:visible}.track i{height:100%;display:block;border-radius:99px}.track em{position:absolute;top:-3px;height:15px;width:2px;background:#4A4A4A;opacity:.65}.compare-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.67rem;margin-top:5px}
.recs{list-style:none;margin:0;padding:0}.recs li{padding:11px 13px;margin-bottom:8px;border-radius:9px;border-left:3px solid var(--accent);background:#f2f4f5;font-size:.88rem}
.recs li.warn{border-color:var(--bad);background:#faf0ed}.recs li.good{border-color:var(--save);background:#f0f4ef}
.step{max-width:760px;margin:0 auto}.step[hidden]{display:none}.step-card{padding:30px}.step-heading{text-align:center;margin-bottom:22px}.step-heading h2{font-size:1.25rem;margin:0}.step-heading p{color:var(--muted);font-size:.88rem;margin:5px 0 0}.step-actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.step-actions .primary{width:auto;min-width:180px;margin:0}.income-input{max-width:360px;margin:0 auto}.income-input input{text-align:center;font-size:1.2rem;padding:14px}.progress{display:flex;justify-content:center;gap:7px;margin:0 auto 20px}.progress i{width:28px;height:4px;background:#d9dfe5;border-radius:5px}.progress i.active{background:var(--accent)}
.category-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.category-group{border:1px solid var(--line);border-radius:12px;padding:15px}.category-group h3{font-size:.84rem;margin:0 0 8px;color:var(--accent)}.category-field{display:grid;grid-template-columns:minmax(0,1fr) 110px;align-items:center;gap:8px;padding:6px 0}.category-field label{margin:0;font-size:.79rem;font-weight:500;color:var(--ink)}.category-field input{padding:8px 9px;text-align:right;font-size:.86rem}.field-help{display:inline-flex;align-items:center;justify-content:center;border:0;background:#eef1f4;color:var(--muted);width:17px;height:17px;padding:0;border-radius:50%;font-size:.7rem;margin-left:4px}.field-help:hover{background:#e0e6eb}@media(max-width:700px){.category-groups{grid-template-columns:1fr}.step-card{padding:20px}}
.help{display:inline-block;position:relative;vertical-align:middle;margin-left:5px}.help summary{list-style:none;cursor:pointer;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#eef1f4;color:var(--muted);font-size:.7rem;font-weight:600}.help summary::-webkit-details-marker{display:none}.help p{position:absolute;z-index:2;top:20px;left:0;width:220px;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:white;box-shadow:0 8px 22px #29313a20;color:var(--muted);font-size:.78rem;line-height:1.4}
</style>
</head>
<body>
<main>
<header><h1>Budget</h1></header>
<p id="loading">Loading Python (about 15 seconds the first time)…</p>
<div class="progress" aria-label="Progress"><i id="p1" class="active"></i><i id="p2"></i><i id="p3"></i></div>
<section id="income-step" class="step"><form id="income-form" class="card step-card" novalidate>
<div class="step-heading"><h2>Monthly take-home income</h2><p>After tax</p></div>
<div class="income-input"><label for="income">Income <details class="help"><summary aria-label="Income help">?</summary><p>Use the amount you receive after taxes each month.</p></details></label><input id="income" type="number" min="0" step="0.01" placeholder="$ 0.00"></div>
<p id="income-err" class="err" role="alert"></p><div class="step-actions" style="justify-content:center"><button class="primary" type="submit">Continue</button></div>
</form></section>
<section id="expense-step" class="step" hidden><div class="card step-card">
<div class="step-heading"><h2>Monthly expenses</h2><p>Fill in what applies. Leave the rest blank.</p></div>
<div id="expense-fields" class="category-groups"></div><p id="expense-err" class="err" role="alert"></p>
<div class="step-actions"><button type="button" id="back-income">Back</button><button type="button" id="show-results" class="primary">See my results</button></div>
</div></section>
<section id="results-step" class="step" hidden><div id="results">
<section class="card hero">
<div class="big" id="big"></div><p id="bigsub"></p>
<div class="split" id="split" role="img" aria-label="How your income is divided"></div>
<div class="legend" id="legend"></div>
</section>
<section class="card"><h2>Recommendations</h2><ul class="recs" id="recs"></ul></section>
<section class="card"><h2>Your spending at a glance</h2><div class="charts">
<div class="chart-card"><h3 class="chart-title">Where your money goes</h3><div id="c1" aria-label="Spending by category"></div></div>
<div class="chart-card"><h3 class="chart-title">Your plan vs guideline</h3><div id="c2" aria-label="Comparison to the 50/30/20 guideline"></div></div>
<div class="chart-card"><h3 class="chart-title">Largest categories</h3><div id="c3" aria-label="Categories as a share of income"></div></div>
</div></section>
</div><div class="step-actions"><button type="button" id="edit-expenses">Edit expenses</button><button type="button" id="start-over">Start over</button></div></section>
</main>
<script type="py" src="./app.py?v=3" config='{"packages":["pandas","numpy"]}'></script>
</body>
</html>
